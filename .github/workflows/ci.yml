name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill scripts
        run: python -m unittest discover -s skills/gtm-shared/tests -p 'test_*.py' -v
      - name: Repo tooling
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version copies agree, shipped surface bumped
        run: |
          python .github/scripts/check_release_version.py \
            --base-ref "origin/${{ github.base_ref || 'main' }}"
